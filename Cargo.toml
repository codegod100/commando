[package]
name = "commando"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Unofficial Linux desktop client for Desktop Commander — AI that executes on your files and terminal."
license = "MIT"
readme = "README.md"
keywords = ["desktop", "agent", "gtk", "relm4", "linux"]
categories = ["gui"]

[[bin]]
name = "commando"
path = "src/main.rs"

[dependencies]
relm4 = { version = "0.11", features = ["libadwaita", "gnome_49"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
thiserror = "2"
walkdir = "2"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
